services:
  - type: web
    name: krisiveda-ml
    runtime: python
    rootDir: KRISIVEDA-ML
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: KRISIVEDA_ML_CORS_ORIGINS
        sync: false
